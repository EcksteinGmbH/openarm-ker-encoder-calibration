<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" width="940" height="440"
     font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <title>Calibration station: one precision shaft, two grating encoders, two couplings</title>
  <desc>A stepper drives, through coupling C1, one precision shaft running in two bearing blocks.
  Two through-bore grating encoders are clamped on that shaft between the bearings; the one nearest
  the unit defines the true angle and the other is a permanent check. A second coupling, C2, drives
  the horn of the sealed encoder unit, whose housing is held in a fixture.</desc>

  <line x1="16" y1="150" x2="924" y2="150" stroke="#808080" stroke-width="1" stroke-dasharray="2 4"/>

  <g stroke="#808080" fill="none" stroke-width="1.6">
    <rect x="20"  y="118" width="100" height="64" rx="6"/>
    <rect x="222" y="112" width="110" height="76" rx="6"/>
    <rect x="344" y="112" width="110" height="76" rx="6"/>
    <rect x="556" y="92"  width="190" height="128" rx="6"/>
    <rect x="574" y="116" width="154" height="38" rx="4"/>
    <rect x="574" y="168" width="154" height="42" rx="4"/>
  </g>

  <path d="M172 150 H504" stroke="#808080" stroke-width="4" fill="none"/>
  <path d="M120 150 H132 M544 150 H574" stroke="#808080" stroke-width="3" fill="none"/>

  <g stroke="#808080" stroke-width="1.6" fill="none">
    <rect x="132" y="132" width="40" height="36" rx="3"/>
    <path d="M142 132 V168 M152 132 V168 M162 132 V168"/>
    <rect x="504" y="132" width="40" height="36" rx="3"/>
    <path d="M514 132 V168 M524 132 V168 M534 132 V168"/>
  </g>

  <g stroke="#808080" stroke-width="1.6" fill="none">
    <rect x="182" y="130" width="30" height="40" rx="2"/>
    <path d="M180 170 H214 M184 170 l-5 7 M194 170 l-5 7 M204 170 l-5 7 M212 170 l-5 7"/>
    <rect x="464" y="130" width="30" height="40" rx="2"/>
    <path d="M462 170 H496 M466 170 l-5 7 M476 170 l-5 7 M486 170 l-5 7 M494 170 l-5 7"/>
  </g>

  <g stroke="#808080" stroke-width="1.6" fill="none">
    <path d="M556 220 H746"/>
    <path d="M576 220 V244 M616 220 V244 M656 220 V244 M696 220 V244 M736 220 V244"/>
    <path d="M564 244 H754"/>
  </g>

  <g fill="#808080" font-size="13">
    <text x="70"  y="155" text-anchor="middle" font-weight="600">Stepper</text>
    <text x="152" y="124" text-anchor="middle" font-size="12" font-weight="600">C1</text>
    <text x="524" y="124" text-anchor="middle" font-size="12" font-weight="600">C2</text>

    <text x="277" y="146" text-anchor="middle" font-weight="600">Grating enc 1</text>
    <text x="277" y="166" text-anchor="middle" font-size="11">the check</text>

    <text x="399" y="146" text-anchor="middle" font-weight="600">Grating enc 2</text>
    <text x="399" y="166" text-anchor="middle" font-size="11">defines θ_true</text>
    <text x="399" y="182" text-anchor="middle" font-size="12" font-style="italic">ψ</text>

    <text x="651" y="84"  text-anchor="middle" font-style="italic">θ_h</text>
    <text x="651" y="110" text-anchor="middle" font-weight="600">ENC_UNIT (sealed)</text>
    <text x="651" y="140" text-anchor="middle" font-size="11">horn (magnet inside)</text>
    <text x="651" y="187" text-anchor="middle" font-size="11">PCB — sensor underneath</text>
    <text x="651" y="203" text-anchor="middle" font-size="11">reads θ_s</text>
    <text x="661" y="262" text-anchor="middle" font-size="11">fixture — housing held, horn driven</text>

    <text x="338" y="212" text-anchor="middle" font-size="11">one precision shaft, h6, runout &lt; 5 µm</text>
    <text x="338" y="226" text-anchor="middle" font-size="11">encoders clamped between the bearings</text>
  </g>

  <g fill="#808080" font-size="12">
    <text x="30" y="308" font-weight="600">Two couplings, and only one of them matters.</text>
    <text x="30" y="328">C1 isolates the stepper's runout and vibration; its error never reaches θ_true. C2 does, so C2 is where the money goes:</text>
    <text x="30" y="346">an encoder-grade diaphragm coupling, ± 6″. The unit is a sealed assembly with its own bearing, so its horn cannot be</text>
    <text x="30" y="364">rigid with the shaft — C2 is structural, not optional.</text>
    <text x="30" y="388">The stepper sits at the far end on purpose: it is a permanent magnet and live coils next to a sensor that measures field</text>
    <text x="30" y="406">direction. The two encoders are clamped 90° apart, so their sub-divisional errors cannot cancel when they are compared.</text>
    <text x="30" y="430">They are clamped once and never re-clamped, which is what the commissioning had to change — see §7.7 and part 2.6.</text>
  </g>
</svg>
