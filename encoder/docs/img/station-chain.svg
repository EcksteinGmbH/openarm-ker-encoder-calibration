<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 392" width="900" height="392"
     font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <title>Calibration station: the mechanical chain, and why there are two couplings</title>
  <desc>A solid-shaft reference encoder is clamped through coupling C1 to one end of a dual-shaft
  stepper. The other end drives, through coupling C2, the horn of the encoder unit under test. The
  unit's housing is held in a fixture. Because the unit carries its own bearing, the horn and the
  stage shaft are two separate bearing systems, which is why a second coupling is required.</desc>

  <line x1="24" y1="150" x2="884" y2="150" stroke="#808080" stroke-width="1" stroke-dasharray="2 4"/>

  <g stroke="#808080" fill="none" stroke-width="1.6">
    <rect x="30"  y="112" width="170" height="80" rx="6"/>
    <rect x="350" y="112" width="170" height="80" rx="6"/>
    <rect x="670" y="92"  width="200" height="130" rx="6"/>
    <rect x="690" y="116" width="160" height="42" rx="4"/>
    <rect x="690" y="170" width="160" height="42" rx="3"/>
  </g>

  <g stroke="#808080" stroke-width="3" fill="none">
    <path d="M200 150 H232"/><path d="M286 150 H350"/>
    <path d="M520 150 H568"/><path d="M622 150 H690"/>
  </g>

  <g stroke="#808080" stroke-width="1.6" fill="none">
    <rect x="232" y="130" width="54" height="40" rx="3"/>
    <path d="M244 130 V170 M259 130 V170 M274 130 V170"/>
    <rect x="568" y="130" width="54" height="40" rx="3"/>
    <path d="M580 130 V170 M595 130 V170 M610 130 V170"/>
  </g>

  <g stroke="#808080" stroke-width="1.6" fill="none">
    <path d="M670 222 H870"/>
    <path d="M690 222 V248 M730 222 V248 M770 222 V248 M810 222 V248 M850 222 V248"/>
    <path d="M678 248 H882"/>
  </g>

  <g fill="#808080" font-size="13">
    <text x="115" y="104" text-anchor="middle" font-style="italic">ψ</text>
    <text x="115" y="144" text-anchor="middle" font-weight="600">Reference encoder</text>
    <text x="115" y="164" text-anchor="middle" font-size="11">solid shaft,</text>
    <text x="115" y="180" text-anchor="middle" font-size="11">its own bearings</text>

    <text x="259" y="122" text-anchor="middle" font-size="12" font-weight="600">C1</text>
    <text x="259" y="190" text-anchor="middle" font-size="10">clamped to the</text>
    <text x="259" y="203" text-anchor="middle" font-size="10">reference for good</text>

    <text x="435" y="104" text-anchor="middle" font-style="italic">θ</text>
    <text x="435" y="148" text-anchor="middle" font-weight="600">Dual-shaft stepper</text>
    <text x="435" y="168" text-anchor="middle" font-size="11">stage shaft</text>

    <text x="595" y="122" text-anchor="middle" font-size="12" font-weight="600">C2</text>
    <text x="595" y="190" text-anchor="middle" font-size="10">its error S2 stays</text>
    <text x="595" y="203" text-anchor="middle" font-size="10">with the stage</text>

    <text x="770" y="82"  text-anchor="middle" font-style="italic">θ_h</text>
    <text x="770" y="110" text-anchor="middle" font-weight="600">ENC_UNIT (sealed)</text>
    <text x="770" y="142" text-anchor="middle" font-size="11">horn — magnet embedded</text>
    <text x="770" y="188" text-anchor="middle" font-size="11">PCB — sensor underneath</text>
    <text x="770" y="204" text-anchor="middle" font-size="11">reads θ_s</text>
    <text x="770" y="266" text-anchor="middle" font-size="11">fixture — housing held, horn driven</text>
  </g>

  <g fill="#808080" font-size="12">
    <text x="30" y="308" font-weight="600">Two independent bearing systems — this is the whole reason for C2.</text>
    <text x="30" y="328">The reference and the stage turn together, but the unit carries its own bearing, so its horn cannot be made rigid with</text>
    <text x="30" y="346">the stage shaft. A station built around one coupling will fight that bearing instead of measuring through it.</text>
    <text x="30" y="370">Calibrating a bare PCB over a station magnet measures the wrong object: another magnet of the same type, or the same</text>
    <text x="30" y="388">PCB re-seated by 0.1–0.2 mm, leaves 0.2–1.4° of error — no better than not calibrating (§2.8, D23).</text>
  </g>
</svg>
